args = ["C:\\Users\\ferra\\Downloads\\KRT-improved\\tools\\krt.py", "run-krt-mcp"]
cwd = "C:\\Users\\ferra\\Downloads\\KRT-improved"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180
required = true

