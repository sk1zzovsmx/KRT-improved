model = "gpt-5.5"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "none"
model_verbosity = "medium"
plan_mode_reasoning_effort = "xhigh"
review_model = "gpt-5.5"
project_doc_max_bytes = 32768
default_permissions = "krt_55to53"

[features]
hooks = true

[permissions.krt_55to53]
description = "KRT delegated workflow profile: workspace editing, no sandbox network, and tighter repo guardrails."
extends = ":workspace"

[permissions.krt_55to53.filesystem.":workspace_roots"]
"**/*.env" = "deny"
"**/.env*" = "deny"
".codex" = "read"
".git" = "read"
"!KRT/Libs" = "read"

[permissions.krt_55to53.network]
enabled = false

[agents]
max_threads = 1
max_depth = 1

[mcp_servers.krt]
